    <!-- ============================================
         LOADING SCREEN STYLES (inline for instant render)
         ============================================ -->
    <style>
      /* ── Reset ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Loading Screen ── */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0a0a;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }

      #app-loader.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ── Steam Animation ── */
      .loader-steam {
        display: flex;
        gap: 6px;
        margin-bottom: -10px;
      }

      .steam-line {
        width: 4px;
        height: 24px;
        background: linear-gradient(to top, transparent, #DC2626aa, transparent);
        border-radius: 4px;
        animation: steamRise 1.4s ease-in-out infinite;
      }

      .steam-line:nth-child(2) { animation-delay: 0.2s; height: 32px; }
      .steam-line:nth-child(3) { animation-delay: 0.4s; }

      @keyframes steamRise {
        0%   { transform: translateY(0) scaleY(1);   opacity: 0; }
        30%  { opacity: 1; }
        100% { transform: translateY(-20px) scaleY(1.3); opacity: 0; }
      }

      /* ── Bowl / Logo Icon ── */
      .loader-icon {
        width: 90px;
        height: 90px;
        position: relative;
        animation: gentlePulse 2s ease-in-out infinite;
      }

      .loader-icon svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 20px #DC262660);
      }

      @keyframes gentlePulse {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.06); }
      }

      /* ── Brand Name ── */
      .loader-brand {
        text-align: center;
      }

      .loader-brand h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(28px, 6vw, 42px);
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 2px;
        line-height: 1;
      }

      .loader-brand h1 span {
        color: #DC2626;
      }

      .loader-brand p {
        font-family: 'Poppins', Arial, sans-serif;
        font-size: clamp(11px, 2.5vw, 13px);
        color: #9ca3af;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 6px;
      }

      /* ── Progress Bar ── */
      .loader-progress-wrap {
        width: min(280px, 80vw);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .loader-progress-bar {
        width: 100%;
        height: 3px;
        background: #1f1f1f;
        border-radius: 99px;
        overflow: hidden;
      }

      .loader-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #DC2626, #f97316, #DC2626);
        background-size: 200% 100%;
        border-radius: 99px;
        animation: progressLoad 2.2s ease forwards, shimmer 1.5s linear infinite;
      }

      @keyframes progressLoad {
        0%   { width: 0%; }
        60%  { width: 75%; }
        90%  { width: 92%; }
        100% { width: 100%; }
      }

      @keyframes shimmer {
        0%   { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      .loader-status {
        font-family: 'Poppins', Arial, sans-serif;
        font-size: 11px;
        color: #4b5563;
        text-align: center;
        letter-spacing: 1px;
        animation: textCycle 2.2s ease forwards;
      }

      @keyframes textCycle {
        0%   { opacity: 1; }
        50%  { opacity: 0.5; }
        100% { opacity: 1; }
      }

      /* ── Decorative Spice Dots ── */
      .loader-spices {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .spice-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #DC2626;
        animation: spicePop 1.2s ease-in-out infinite;
      }

      .spice-dot:nth-child(1) { animation-delay: 0s;    background: #DC2626; }
      .spice-dot:nth-child(2) { animation-delay: 0.15s; background: #f97316; width: 8px; height: 8px; }
      .spice-dot:nth-child(3) { animation-delay: 0.3s;  background: #eab308; }
      .spice-dot:nth-child(4) { animation-delay: 0.45s; background: #f97316; width: 8px; height: 8px; }
      .spice-dot:nth-child(5) { animation-delay: 0.6s;  background: #DC2626; }

      @keyframes spicePop {
        0%, 100% { transform: translateY(0);   opacity: 0.4; }
        50%       { transform: translateY(-5px); opacity: 1; }
      }

      /* ── Hide body scroll while loading ── */
      body.loading { overflow: hidden; }
    </style>

    <!-- ============================================
         LOADER SCRIPT
         ============================================ -->
    <script>
      (function () {
        const loader = document.getElementById('app-loader');
        const statusText = document.getElementById('loader-status-text');

        const messages = [
          'Preparing your experience...',
          'Heating the spices...',
          'Layering the rice...',
          'Almost ready to serve...',
          'Welcome to Shan Biryani!'
        ];

        let msgIndex = 0;
        const interval = setInterval(function () {
          msgIndex = (msgIndex + 1) % messages.length;
          if (statusText) statusText.textContent = messages[msgIndex];
        }, 500);

        function hideLoader() {
          clearInterval(interval);
          if (statusText) statusText.textContent = 'Welcome to Shan Biryani!';
          setTimeout(function () {
            if (loader) {
              loader.classList.add('fade-out');
              document.body.classList.remove('loading');
              setTimeout(function () {
                loader.style.display = 'none';
              }, 650);
            }
          }, 300);
        }

        // Hide after React mounts OR after max 4s — whichever first
        window.__shanBiryaniLoaderDone = hideLoader;

        // Safety fallback
        setTimeout(hideLoader, 4000);
      })();
    </script>
